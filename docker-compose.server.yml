# 阿里云 ECS 公网部署：backend + frontend，Postgres 用宿主机本机 5432
#
# 用法（在服务器项目目录）：
#   docker compose -f docker-compose.server.yml -p zhitu up -d --build
# 访问：http://<公网IP>/

name: zhitu

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zhitu-backend
    env_file:
      - .env
    environment:
      PG_HOST: host.docker.internal
      PG_PORT: "5432"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 注册用户持久化（含默认管理员 / 体验用户种子）
      - ./backend/data:/app/backend/data
    # 不对外暴露 5000：仅经 nginx /api 反代
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zhitu-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
