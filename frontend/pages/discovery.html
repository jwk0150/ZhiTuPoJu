<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>执图破局 · 新岗位发现</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20260825soft" />
  <link rel="stylesheet" href="../css/shell.css?v=20260825soft" />
  <link rel="stylesheet" href="../css/components.css?v=50" />
  <link rel="stylesheet" href="../css/legacy-views.css?v=20260825soft" />
  <link rel="stylesheet" href="../css/page-polish.css?v=50" />
  <link rel="stylesheet" href="../css/discovery-favs.css?v=1" />
  <link rel="stylesheet" href="../css/discovery-workbench.css?v=no-spark-gold" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body class="standalone-view" data-page="discovery">
  <div id="app-shell"></div>
  <main class="page-main" id="page-main">
<section class="view active disc-home" id="view-discovery">

  <aside class="dd-fav-bar enter" style="--d:.01s" id="dd-fav-bar" aria-label="收藏栏">
    <div class="dd-fav-bar-head">
      <span class="dd-fav-bar-title">收藏栏</span>
      <span class="dd-fav-bar-count">0</span>
    </div>
    <div class="dd-fav-bar-track" id="dd-fav-bar-track"></div>
  </aside>

  <!-- 一、页面价值区 -->
  <header class="dh-value enter" style="--d:.02s">
    <div class="dh-value-main">
      <h1 class="dh-title">新岗位发现</h1>
      <p class="dh-lead">基于真实岗位数据库持续发现新兴岗位，并结合 AI 分析预测未来可能衍生的岗位。</p>
      <p class="dh-meta">
        <span>已扫描 <b id="disc-hero-scanned">5328</b> 岗位</span>
        <span class="sep" aria-hidden="true">·</span>
        <span>更新 <b id="disc-updated-at">--:--</b></span>
        <span class="sep" aria-hidden="true">·</span>
        <span>分析周期 <b>近 90 天</b></span>
      </p>
    </div>
    <button type="button" class="dh-daily" id="btn-discovery-daily" onclick="window.openDiscoveryDaily && window.openDiscoveryDaily()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      查看发现日报
    </button>
  </header>

  <!-- 二、核心数据洞察：真实 | 预测 -->
  <div class="dh-insight enter" style="--d:.06s" aria-label="核心洞察">
    <button type="button" class="dh-panel is-real" data-filter="found" id="insight-real">
      <div class="dh-panel-head">
        <span class="dh-panel-kicker">真实发现</span>
        <span class="dh-panel-hint">市场已出现</span>
      </div>
      <div class="dh-panel-body">
        <div class="dh-panel-metrics">
          <div class="dh-metric">
            <span class="dh-metric-label">新发现岗位</span>
            <strong class="dh-metric-val" id="kpi-discovered">0</strong>
          </div>
          <div class="dh-metric">
            <span class="dh-metric-label">本周期信号</span>
            <strong class="dh-metric-val" id="kpi-pending">0</strong>
          </div>
          <div class="dh-metric">
            <span class="dh-metric-label">环比</span>
            <strong class="dh-metric-val is-up" id="kpi-discovered-trend">+32%</strong>
          </div>
        </div>
      </div>
    </button>

    <button type="button" class="dh-panel is-pred" data-filter="forecast" id="insight-pred">
      <div class="dh-panel-head">
        <span class="dh-panel-kicker">未来预测</span>
        <span class="dh-panel-hint">AI 推演衍生</span>
      </div>
      <div class="dh-panel-body">
        <div class="dh-panel-metrics">
          <div class="dh-metric">
            <span class="dh-metric-label">预测新岗位</span>
            <strong class="dh-metric-val" id="kpi-forecast">0</strong>
          </div>
          <div class="dh-metric">
            <span class="dh-metric-label">高置信度</span>
            <strong class="dh-metric-val" id="kpi-forecast-high">0</strong>
          </div>
          <div class="dh-metric">
            <span class="dh-metric-label">潜力趋势</span>
            <strong class="dh-metric-val is-up" id="kpi-forecast-trend">+28%</strong>
          </div>
        </div>
      </div>
      <span id="kpi-adopted" hidden>0</span>
      <span id="kpi-pending-trend" hidden>+18%</span>
      <span id="kpi-adopted-trend" hidden>+15%</span>
    </button>
  </div>

  <!-- 三、工具栏 -->
  <div class="dh-toolbar enter" style="--d:.1s">
    <div class="dh-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="discovery-search" placeholder="搜索岗位名称、技能或关键词…" autocomplete="off">
    </div>
    <select class="dh-select" id="discovery-city" aria-label="行业/城市">
      <option value="all">行业 / 城市</option>
      <option value="北京">北京</option><option value="上海">上海</option><option value="深圳">深圳</option>
      <option value="杭州">杭州</option><option value="广州">广州</option><option value="成都">成都</option>
      <option value="远程">远程</option><option value="全国">全国</option>
    </select>
    <select class="dh-select" id="discovery-cat" aria-label="岗位方向">
      <option value="all">岗位方向</option>
      <option value="人工智能">人工智能</option><option value="后端开发">后端开发</option>
      <option value="前端开发">前端开发</option><option value="数据科学">数据科学</option>
      <option value="产品运营">产品运营</option><option value="运维测试">运维测试</option><option value="安全">安全</option>
    </select>
    <select class="dh-select" id="discovery-range" aria-label="时间范围">
      <option value="90">近 90 天</option>
      <option value="30">近 30 天</option>
      <option value="7">近 7 天</option>
      <option value="365">近 1 年</option>
    </select>
    <select class="dh-select" id="discovery-sort" aria-label="排序">
      <option value="confidence">热度排序</option>
      <option value="date">按时间</option>
      <option value="name">按名称</option>
    </select>
    <select class="dh-select" id="discovery-kind" hidden aria-label="发现类型">
      <option value="found" selected>真实发现</option>
      <option value="forecast">未来预测</option>
    </select>
    <select class="dh-select" id="discovery-conf" hidden>
      <option value="all">置信度</option><option value="80">≥80%</option><option value="60">≥60%</option>
    </select>
    <button type="button" class="dh-rescan" id="btn-agent-rescan" onclick="agentScan()" title="重新扫描">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
      扫描
    </button>
  </div>

  <!-- 四、真实 / 预测切换（不同时展示） -->
  <nav class="dh-switch enter" style="--d:.12s" id="dh-type-tabs" role="tablist" aria-label="岗位类型切换">
    <button type="button" class="dh-tab is-real is-active" data-kind="found" role="tab" aria-selected="true">
      真实发现 <b id="disc-found-count">0</b>
    </button>
    <button type="button" class="dh-tab is-pred" data-kind="forecast" role="tab" aria-selected="false">
      未来预测 <b id="disc-forecast-count">0</b>
    </button>
    <span id="disc-total-count" hidden>0</span>
  </nav>

  <!-- 五、岗位卡片矩阵 -->
  <div class="dh-board enter" id="discovery-results" data-view-mode="list" data-kind="found" style="--d:.16s">
    <section class="dh-sec" id="disc-sec-found" data-sec="found">
      <div class="dh-sec-label is-real" id="disc-sec-found-label" hidden><i></i>真实发现</div>
      <div class="dh-grid job-grid" id="discovery-grid"></div>
      <div class="dh-pager" id="found-pager-wrap" hidden>
        <nav class="proto-pager" id="found-pager" aria-label="发现岗位分页"></nav>
        <label class="proto-page-jump">跳至 <input type="number" id="found-page-input" min="1" step="1" inputmode="numeric"> 页 <button type="button" data-jump="found">前往</button></label>
      </div>
    </section>
    <section class="dh-sec is-forecast" id="disc-sec-forecast" data-sec="forecast" hidden>
      <div class="dh-sec-head-row" id="disc-sec-forecast-label">
        <button type="button" class="dh-track-link" id="proto-track-entry" onclick="window.openTrackLog()">
          跟踪清单 <span class="n" id="proto-track-count">0</span>
        </button>
      </div>
      <div class="dh-grid job-grid" id="forecast-grid"></div>
      <div class="dh-pager" id="forecast-pager-wrap" hidden>
        <nav class="proto-pager" id="forecast-pager" aria-label="预测岗位分页"></nav>
        <label class="proto-page-jump">跳至 <input type="number" id="forecast-page-input" min="1" step="1" inputmode="numeric"> 页 <button type="button" data-jump="forecast">前往</button></label>
      </div>
    </section>
  </div>

  <footer class="dh-footer">
    <span id="disc-total-label">共 0 个岗位</span>
    <span class="dh-footer-tip">点击卡片进入岗位详情页</span>
  </footer>

  <!-- 兼容旧钩子（隐藏） -->
  <div id="discovery-tabs" hidden>
    <div class="tab-item active" data-status="all"></div>
    <div class="tab-item" data-status="found"></div>
    <div class="tab-item" data-status="pending"></div>
    <div class="tab-item" data-status="adopted"></div>
    <div class="tab-item" data-status="forecast"></div>
    <div class="tab-item" data-status="rejected"></div>
  </div>
  <button type="button" id="btn-agent-scan" onclick="agentScan()" hidden>扫描</button>
  <span id="disc-pg-count" hidden></span>
  <span id="disc-engine-badge" hidden></span>
  <span id="disc-llm-badge" hidden></span>
  <span id="disc-left-meta" hidden></span>
  <div id="disc-stream" hidden></div>
  <div id="disc-phase-live" hidden><span class="pulse-dot"></span></div>
  <div id="disc-radar" hidden></div>
  <div id="disc-hallucination" hidden></div>
  <div id="disc-particles" hidden></div>
  <div class="proto-orb-slot" id="proto-orb-slot" hidden aria-hidden="true">
    <div class="proto-stage" id="proto-stage"><aside class="disc-left" id="disc-left"><div id="disc-3d" class="disc-3d"></div></aside></div>
  </div>
  <canvas id="disc-cluster-canvas" hidden></canvas>
  <p id="disc-hero-desc" hidden></p>

  <div class="proto-track-mask" id="proto-track-mask" onclick="closeTrackLog()"></div>
  <aside class="proto-track-panel" id="proto-track-panel" role="dialog" aria-modal="true" aria-labelledby="proto-track-title" aria-hidden="true">
    <div class="proto-track-panel-head">
      <div>
        <h2 id="proto-track-title">跟踪清单</h2>
        <p id="proto-track-sub">跟踪预测岗位后记录会出现在这里</p>
      </div>
      <button type="button" class="proto-track-panel-close" onclick="closeTrackLog()" aria-label="关闭">×</button>
    </div>
    <div class="proto-track-panel-body" id="proto-track-rail-body"><div class="proto-track-rail-empty">暂无跟踪记录。</div></div>
  </aside>

  <div class="proto-scan-layer" id="proto-scan-layer" aria-hidden="true">
    <svg class="proto-bridge" id="disc-bridge" aria-hidden="true"><defs>
      <linearGradient id="discAxonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#d4b07a" stop-opacity="0.2"/>
        <stop offset="50%" stop-color="#d4b07a" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#c4a574" stop-opacity="0.55"/>
      </linearGradient>
    </defs></svg>
  </div>

  <div class="proto-suggest-mask" id="proto-suggest-mask" onclick="closeAiSuggestions()"></div>
  <aside class="proto-suggest" id="proto-suggest" role="dialog" aria-modal="true" aria-labelledby="proto-suggest-title" aria-hidden="true">
    <div class="proto-suggest-head">
      <div class="proto-suggest-brand">
        <div class="proto-suggest-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.8L19 9.5l-4.2 2.7L16 17l-4-2.6L8 17l1.2-4.8L5 9.5l5.2-1.7L12 3z"/></svg></div>
        <div><h2 id="proto-suggest-title">AI 采购顾问</h2><p id="proto-suggest-sub">基于本轮扫描的高置信度岗位排序</p></div>
      </div>
      <button type="button" class="proto-suggest-close" onclick="closeAiSuggestions()" aria-label="关闭">×</button>
    </div>
    <div class="proto-suggest-body" id="proto-suggest-body"></div>
    <div class="proto-suggest-foot">
      <div class="proto-suggest-compose">
        <textarea id="proto-suggest-input" rows="1" placeholder="问问采购顾问…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();window.sendAiSuggestChat();}"></textarea>
        <button type="button" class="proto-suggest-send" id="proto-suggest-send" onclick="window.sendAiSuggestChat()">发送</button>
      </div>
      <div class="proto-suggest-actions">
        <button type="button" class="proto-suggest-secondary" onclick="closeAiSuggestions()">稍后再说</button>
        <button type="button" class="proto-suggest-primary" onclick="agentBatchAdopt(); closeAiSuggestions();">一键采购推荐项</button>
      </div>
    </div>
  </aside>

  <!-- 详情模块：点击卡片后打开（非首页内嵌） -->
  <aside class="disc-drawer" id="disc-drawer" aria-hidden="true">
    <div class="disc-drawer-head">
      <div>
        <p class="disc-drawer-kicker" id="disc-drawer-kicker">岗位详情</p>
        <h2 id="disc-drawer-title">岗位详情</h2>
      </div>
      <button type="button" onclick="closeDiscoveryDrawer()" aria-label="关闭">×</button>
    </div>
    <div class="disc-drawer-tabs" id="disc-drawer-tabs" role="tablist">
      <button type="button" class="is-active" data-tab="overview">概览</button>
      <button type="button" data-tab="skills">核心技能</button>
      <button type="button" data-tab="trend">发展趋势</button>
      <button type="button" data-tab="related">关联与演化</button>
      <button type="button" data-tab="evidence">数据依据</button>
    </div>
    <div class="disc-drawer-body" id="disc-drawer-body"></div>
    <div class="disc-drawer-actions" id="disc-drawer-actions"></div>
  </aside>
  <div class="disc-drawer-mask" id="disc-drawer-mask" onclick="closeDiscoveryDrawer()"></div>
</section>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/runtime-core.js"></script>
  <script src="../js/cinema-bg.js?v=20260825soft"></script>
  <script src="../js/perf-guard.js?v=1"></script>
  <script src="../js/cinema-music.js?v=20260824mem"></script>
  <script src="../js/shell.js?v=20260825rx5"></script>
  <script src="../js/discovery-mock.js?v=1"></script>
  <script src="../js/discovery-favs.js?v=1"></script>
  <script src="../js/pages/discovery.js?v=fix25"></script>
  <script src="../js/pages/discovery-workbench.js?v=10"></script>
  <script>
    window.Shell && window.Shell.mount({ pageId: 'discovery', title: '新岗位发现', subtitle: '真实发现 · AI 未来预测' });
    window.initDiscovery && window.initDiscovery();
    window.initDiscoveryHome && window.initDiscoveryHome();
  </script>
</body>
</html>
