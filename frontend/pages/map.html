<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>执图破局 · 数字人才地图</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20260825soft" />
  <link rel="stylesheet" href="../css/shell.css?v=20260825soft" />
  <link rel="stylesheet" href="../css/components.css?v=20260824a" />
  <link rel="stylesheet" href="../css/legacy-views.css?v=20260826switch" />
  <link rel="preload" href="../assets/china-geo.json" as="fetch" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" as="script" />
  <script>
    /* 尽早并行拉 echarts + 中国地图 GeoJSON，缩短首屏空白 */
    (function () {
      if (!window.__echartsLoading && !window.echarts) {
        window.__echartsLoading = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';
          s.async = true;
          s.onload = function () { resolve(window.echarts); };
          s.onerror = function () { reject(new Error('echarts load failed')); };
          document.head.appendChild(s);
        });
      }
      if (!window.__chinaGeoPrefetch) {
        window.__chinaGeoPrefetch = fetch('../assets/china-geo.json')
          .then(function (r) { return r.json(); })
          .catch(function () { return null; });
      }
    })();
  </script>
  <!-- echarts / geo 已在上方并行预取 -->
</head>
<body class="standalone-view" data-page="map">
  <div id="app-shell"></div>
  <main class="page-main" id="page-main">
<section class="view active" id="view-map">
<div class="page-header">
<div class="page-title-block">
<h1>数字人才地图</h1>
<div class="subtitle">全国人才分布 · 省份岗位洞察 · 岗位-能力知识图谱 · <span id="talent-stats-text">--</span></div>
</div>
<div class="page-actions">
<button class="btn btn-primary" id="talent-ability-btn" onclick="window.talentOpenAbility()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5"/></svg>我的能力</button>
</div>
</div>
<div class="graph-layout">

<!-- 中间可视化区 -->
<div class="graph-canvas" id="talent-map-canvas">

<!-- 统一返回操作区（地图左上角） -->
<div id="talent-back-zone">
<button class="btn" onclick="window.talentMapBack()" id="talent-back-btn" style="display:none" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>返回</button>
<button class="btn" id="talent-province-back-btn" onclick="window.talentMapBackToNational()" style="display:none" type="button">← 返回全国总览</button>
<button class="btn" id="talent-detail-back-btn" onclick="window.talentMapBack()" style="display:none" type="button">← 返回地图</button>
</div>

<!-- 左侧边缘筛选触发标签 -->
<div class="graph-filter-edge-tab" id="graph-filter-toggle" onclick="window.talentMapToggleFilter()" title="展开筛选">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M0 4h24L13.5 12v8l-3-2.5V12z"/></svg>
<span class="tab-label">筛选</span>
</div>
<!-- 悬浮筛选面板 -->
<div class="graph-filter-float-panel" id="graph-filter-panel">
<div class="filter-panel-title"><span>数据筛选</span><button class="filter-panel-close" onclick="window.talentMapToggleFilter()">✕</button></div>
<div class="filter-group-vert">
<label>省份</label>
<select id="talent-filter-province" onchange="window.talentOnProvinceChange()"><option value="">全部省份</option></select>
</div>
<div class="filter-group-vert">
<label>地区</label>
<select id="talent-filter-city" onchange="window.talentOnCityChange()"><option value="">全部地区</option></select>
</div>
<div class="filter-group-vert">
<label>岗位</label>
<select id="talent-filter-job"><option value="">全部岗位</option></select>
</div>
<div class="filter-group-vert">
<label>学历要求</label>
<select id="talent-filter-edu" onchange="window.talentMapApplyFilter()"><option value="">不限学历</option><option>本科</option><option>硕士</option><option>博士</option><option>大专</option></select>
</div>
<div class="filter-group-vert">
<label>经验要求</label>
<select id="talent-filter-exp" onchange="window.talentMapApplyFilter()"><option value="">不限经验</option><option>应届生</option><option>1-3年</option><option>3-5年</option><option>5-10年</option><option>10年以上</option></select>
</div>
<div class="filter-panel-actions">
<div style="display:flex;gap:8px;width:100%">
<button class="btn btn-primary" style="flex:1;padding:10px 0;font-size:13px" onclick="window.talentMapResetFilter()">重置筛选</button>
<button class="btn btn-primary" style="flex:1;padding:10px 0;font-size:13px" onclick="window.talentMapApplyFilter()">应用筛选</button>
</div>
<div class="filter-hint">省份 → 地区 → 岗位 级联筛选 · 应用筛选进入对应岗位分析</div>
</div>
</div>
<!-- 省份飞入过渡叠加层 -->
<div class="talent-flyin-overlay" id="talent-flyin-overlay"></div>
<!-- Layer 1: 中国地图 -->
<div class="talent-map-layer" id="talent-layer-map" style="width:100%;height:100%"></div>
<!-- 港澳局部放大框 -->
<div class="ganga-zoom-box" id="ganga-zoom-box">
<div class="ganga-zoom-title">港澳区域</div>
<div class="ganga-zoom-province" id="ganga-zoom-hk" data-province="香港"
onclick="window.gangaZoomClick('香港')"
onmouseenter="window.gangaZoomHover('香港',true)"
onmouseleave="window.gangaZoomHover('香港',false)">
<span class="ganga-zoom-name">香港</span>
<div class="ganga-zoom-bar-wrap"><div class="ganga-zoom-bar" id="ganga-bar-hk"></div></div>
<span class="ganga-zoom-data" id="ganga-data-hk">--</span>
</div>
<div class="ganga-zoom-province" id="ganga-zoom-mo" data-province="澳门"
onclick="window.gangaZoomClick('澳门')"
onmouseenter="window.gangaZoomHover('澳门',true)"
onmouseleave="window.gangaZoomHover('澳门',false)">
<span class="ganga-zoom-name">澳门</span>
<div class="ganga-zoom-bar-wrap"><div class="ganga-zoom-bar" id="ganga-bar-mo"></div></div>
<span class="ganga-zoom-data" id="ganga-data-mo">--</span>
</div>
</div>
<!-- 引导线 SVG -->
<svg class="ganga-guide-svg" id="ganga-guide-svg">
<path id="ganga-path-hk" d=""/>
<circle class="ganga-dot" id="ganga-dot-hk" cx="0" cy="0" r="3"/>
<path id="ganga-path-mo" d=""/>
<circle class="ganga-dot" id="ganga-dot-mo" cx="0" cy="0" r="3"/>
</svg>
<!-- Layer 2: 省份岗位列表 -->
<div class="talent-map-layer" id="talent-layer-province" style="display:none;width:100%;height:100%;overflow-y:auto;padding:68px 28px 24px 36px;box-sizing:border-box">
<div class="talent-province-header">
<h2 id="talent-province-title"></h2>
</div>
<div class="talent-province-stats" id="talent-province-stats"></div>
<div id="talent-province-jobs"></div>
</div>
<!-- Layer 3: 岗位能力知识图谱（脑图） -->
<div class="talent-map-layer" id="talent-layer-graph" style="display:none">
<div style="width:100%;height:100%;position:relative;display:flex;flex-direction:column;min-width:0">
<div class="graph-toolbar">
<div class="graph-toolbar-left">
<button class="graph-btn talent-graph-back-inbar" id="talent-graph-back-btn" title="返回岗位分析" onclick="window.talentGraphBack()" type="button" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<div class="graph-city-label" id="talent-graph-city-label">--</div>
<div class="graph-mode-toggle" id="talent-graph-mode-toggle" data-active="overview" style="display:none">
<span class="graph-mode-pill" id="talent-graph-mode-pill" aria-hidden="true"></span>
<button class="graph-mode-bubble active" id="talent-graph-view-overview" title="当前岗位 → 所需技术 → 技术关联" onclick="window.talentSetJobGraphView('overview')">岗位技术图谱</button>
<button class="graph-mode-bubble" id="talent-graph-view-stack" title="技术分类 → 层级归属关系" onclick="window.talentSetJobGraphView('stack')">技术栈</button>
<button class="graph-mode-bubble" id="talent-graph-view-level" title="岗位级别 → 所需技术" onclick="window.talentSetJobGraphView('level')">级别</button>
</div>
</div>
<div class="graph-actions">
<button class="graph-btn" title="适应窗口" onclick="window.talentGraphFit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
</div>
</div>
<div id="talent-graph-container" style="flex:1;overflow:hidden;position:relative"></div>
<div class="graph-legend">
<div class="legend-item"><span class="legend-dot" style="background:#C9A86A"></span>编程语言</div>
<div class="legend-item"><span class="legend-dot" style="background:#8FA894"></span>框架与开发</div>
<div class="legend-item"><span class="legend-dot" style="background:#D4B87A"></span>数据存储</div>
<div class="legend-item"><span class="legend-dot" style="background:#6B8F7A"></span>工程化运维</div>
<div class="legend-item"><span class="legend-dot" style="background:#E4CFA0"></span>AI与算法</div>
</div>
</div>
</div>
</div>

<!-- 右侧详情 -->
<div class="graph-detail" id="talent-detail-panel">
<div class="detail-empty" id="talent-detail-empty">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>

</div>
<div id="talent-detail-hover" style="display:none;padding:20px">
<h3 style="color:var(--text-dark);margin-bottom:6px" id="talent-hover-name"></h3>
<div style="display:flex;gap:8px;margin-bottom:14px">
<span id="talent-hover-badge" class="detail-cat" style="padding:2px 8px;font-size:11px;border-radius:6px"></span>
</div>

<div class="detail-stat" id="talent-hover-hot-wrap"><div class="detail-stat-label">热门指数</div><div class="detail-stat-value" id="talent-hover-hot">--</div></div>

<div id="talent-hover-city-block" style="display:none">

<div id="talent-hover-skills" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<div class="detail-section-title">行业占比</div>
<div id="talent-hover-industry" style="display:flex;flex-direction:column;gap:6px"></div>
<div class="detail-section-title">学历占比</div>
<div id="talent-hover-edu" style="display:flex;flex-direction:column;gap:6px"></div>
</div>
<button class="btn btn-primary" style="width:100%" id="talent-hover-btn" onclick="window.talentMapClickCurrent()">查看详情 →</button>
</div>
<div id="talent-detail-province" style="display:none;padding:20px">
<h3 style="color:var(--text-dark);margin-bottom:4px" id="talent-prov-detail-name"></h3>
<div style="font-size:12px;color:var(--text-muted);margin-bottom:14px" id="talent-prov-detail-sub"></div>
<div class="detail-stat-grid" id="talent-prov-stats-grid"></div>
<div class="detail-section-title">TOP 岗位</div>
<div id="talent-prov-top-jobs" style="margin-bottom:14px"></div>
<div class="detail-section-title">7日热度趋势</div>
<div style="height:140px" id="talent-prov-trend"></div>
<button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="window.talentMapEnterProvince()">进入省份岗位分析 →</button>
</div>
<div id="talent-detail-job" style="display:none;padding:20px"></div>
</div>
</div>
</section>
<!-- 我的能力弹窗（能力问卷 / 个人能力图谱） -->
<div class="ability-modal-mask" id="ability-modal" style="display:none">
<div class="ability-modal">
<div class="ability-modal-head">
<div class="ability-modal-title">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5"/></svg>
<span id="ability-modal-title-text">我的能力</span>
</div>
<button class="ability-modal-close" onclick="window.talentAbilityClose()" title="关闭">✕</button>
</div>
<div class="ability-modal-body" id="ability-modal-body"></div>
</div>
</div>
  </main>
  <script src="../js/api.js?v=20260824fix"></script>
  <script src="../js/runtime-core.js?v=20260824fix"></script>
  <script src="../js/cinema-bg.js?v=20260825hover"></script>
  <script src="../js/perf-guard.js?v=1"></script>
  <script src="../js/cinema-music.js?v=20260824mem"></script>
  <script src="../js/shell.js?v=20260825c3"></script>
  <script src="../js/pages/map.js?v=20260826nodistrict"></script>
  <script>
    window.Shell && window.Shell.mount({ pageId: 'map', title: '数字人才地图', subtitle: '区域人才与岗位能力空间洞察' });
    function bootMap() {
      if (typeof window.initTalentMap === 'function') window.initTalentMap();
    }
    function whenEcharts(cb) {
      if (window.echarts) { cb(); return; }
      var p = window.__echartsLoading;
      if (p && typeof p.then === 'function') {
        p.then(function () { cb(); }).catch(function () { cb(); });
        return;
      }
      window.__echartsLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';
        s.async = true;
        s.onload = function () { resolve(window.echarts); cb(); };
        s.onerror = function () { reject(new Error('echarts load failed')); };
        document.head.appendChild(s);
      });
    }
    function startBoot() { whenEcharts(bootMap); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startBoot);
    } else {
      startBoot();
    }
  </script>
  <script>
    // 「我的能力」兜底：仅提示，不再强制整页 nocache 刷新（避免二次加载卡顿）
    (function () {
      function bootAbilityGuard() {
        if (typeof window.talentOpenAbility === 'function') return;
        console.warn('[ability] window.talentOpenAbility 缺失，请硬刷新后重试');
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(bootAbilityGuard, 800);
        });
      } else {
        setTimeout(bootAbilityGuard, 800);
      }
    })();
  </script>
</body>
</html>
