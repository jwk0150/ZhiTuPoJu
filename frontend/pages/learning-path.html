<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>执图破局 · 学习路径建议</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/shell.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/legacy-views.css" />
  <link rel="stylesheet" href="../css/page-polish.css" />
  <script src="../trends-mock.js" defer></script>
</head>
<body class="standalone-view" data-page="learningPath">
  <div id="app-shell"></div>
  <main class="page-main" id="page-main">
    <section class="view active" id="view-learningPath">
      <div class="page-header">
        <a class="btn" id="lp-back-link" href="insight.html?v=2">← 返回演化分析</a>
        <div class="page-title-block">
          <h1>学习路径建议</h1>
          <div class="subtitle">基于岗位能力演化趋势，分阶段推荐最优学习路径</div>
        </div>
      </div>
      <div class="lp-layout">
        <aside class="card lp-sidebar">
          <div class="card-header"><div class="card-title">岗位选择</div></div>
          <div class="card-body">
            <input type="text" class="input" id="lp-search" placeholder="搜索岗位名称">
            <div class="lp-job-list" id="lp-job-list"></div>
          </div>
        </aside>
        <div class="lp-main">
          <div class="lp-top-row">
            <div class="card lp-steps-card">
              <div class="card-body">
                <div class="lp-steps" id="lp-steps"></div>
              </div>
            </div>
            <div class="card lp-effect-card">
              <div class="card-header"><div class="card-title">学习效果预估</div></div>
              <div class="card-body">
                <div class="lp-effect">
                  <div class="lp-effect-pct"><strong id="lp-effect-pct">86</strong><span>%</span></div>
                  <div class="lp-effect-label">掌握以上技能后<br>能力提升</div>
                  <div class="lp-chart" id="lp-effect-chart"></div>
                  <div class="lp-stars" id="lp-stars">★★★★☆</div>
                  <div class="lp-effect-sub">岗位竞争力</div>
                </div>
              </div>
            </div>
          </div>
          <div class="card lp-detail-card">
            <div class="card-header"><div class="card-title">路径详情</div></div>
            <div class="card-body">
              <div class="lp-detail" id="lp-detail"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/runtime-core.js"></script>
  <script src="../js/cinema-bg.js?v=20260824mem"></script>
  <script src="../js/perf-guard.js?v=1"></script>
  <script src="../js/cinema-music.js?v=20260824mem"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/pages/evolution.js"></script>
  <script>
    window.Shell && window.Shell.mount({ pageId: 'learningPath', title: '学习路径建议', subtitle: '能力演化与宏观趋势' });
    // 返回链接使用统一路径，并加时间戳防止缓存
    (function () {
      var back = document.getElementById('lp-back-link');
      if (back) {
        var base = (window.PAGE_HREF && window.PAGE_HREF.evolution) || 'insight.html?v=2';
        back.href = base + (base.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();
      }
    })();
    function loadEcharts(cb) {
      if (window.echarts) { cb(); return; }
      if (window.__echartsLoading) { window.__echartsLoading.then(cb); return; }
      window.__echartsLoading = new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';
        s.async = true;
        s.onload = function () { resolve(window.echarts); cb(); };
        document.head.appendChild(s);
      });
    }
    window.addEventListener('DOMContentLoaded', function () {
      loadEcharts(function () {
        try { window.initEvolution && window.initEvolution(); } catch (e) { console.error('[initEvolution]', e); }
        try { window.initLearningPath && window.initLearningPath(); } catch (e) { console.error('[initLearningPath]', e); }
      });
    });
  </script>
</body>
</html>
