<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岗位大新闻 · 未来职业资讯中心</title>
  <meta name="description" content="洞察岗位变化，把握职业趋势 —— 面向年轻人的未来职业资讯中心。" />
  <link rel="stylesheet" href="../../css/tokens.css?v=49" />
  <link rel="stylesheet" href="../../css/shell.css?v=49" />
  <link rel="stylesheet" href="../../css/components.css?v=49" />
  <link rel="stylesheet" href="css/news.css" />
</head>
<body data-page="news">
  <div id="app-shell"></div>
  <main class="page-main jn-page" id="page-main">
    <!-- Loading 骨架 -->
    <div class="jn-container" id="app-loading" aria-hidden="true">
      <div class="jn-skeleton" style="height:118px;border-radius:18px;margin-top:26px"></div>
      <div style="display:grid;grid-template-columns:1.55fr 1fr;gap:22px;margin-top:20px">
        <div class="jn-skeleton" style="height:384px;border-radius:22px"></div>
        <div class="jn-skeleton" style="height:384px;border-radius:22px"></div>
      </div>
      <div class="jn-skeleton" style="height:96px;border-radius:18px;margin-top:20px"></div>
      <div class="jn-skeleton" style="height:96px;border-radius:18px;margin-top:14px"></div>
    </div>

    <!-- 内容 -->
    <div id="app" hidden>
      <!-- 全屏滚动容器 -->
      <div class="jn-fullpage" id="jn-fullpage">
        <section class="jn-screen jn-screen--hero" id="screen-focus" data-label="岗位头版">
          <div class="jn-screen-inner">
            <!-- 杂志式页头 -->
            <header class="jn-hero-header">
              <div class="jn-hero-brand">
                <span class="jn-hero-logo" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6.5C4 5.1 5.1 4 6.5 4h11C18.9 4 20 5.1 20 6.5V19a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 17.5v-11Z"/>
                    <path d="M4 8.5h16"/>
                    <path d="M8 13h5M8 16h7"/>
                    <circle cx="17" cy="11.5" r="1.7" fill="currentColor" stroke="none"/>
                  </svg>
                </span>
                <span class="jn-hero-brand-name">岗位大新闻</span>
                <span class="jn-hero-brand-en">JOB NEWS</span>
              </div>
              <div class="jn-hero-update" id="jn-topbar-update"></div>
              <a class="jn-hero-all" href="all.html">全部焦点 <span aria-hidden="true">→</span></a>
            </header>

            <!-- 主内容区：由 home.js 渲染 -->
            <div id="focus" class="jn-hero-main"></div>

            <!-- 滚动提示 -->
            <div class="jn-hero-scroll" aria-hidden="true">
              <span>向下滚动 探索更多岗位趋势</span>
              <span class="jn-hero-scroll-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
              </span>
            </div>
          </div>
        </section>
        <section class="jn-screen" id="screen-industry" data-label="行业快讯">
          <div class="jn-screen-inner"><div id="latest-cols"></div></div>
        </section>
        <section class="jn-screen" id="screen-hot" data-label="热门资讯">
          <div class="jn-screen-inner"><div id="hot-cols"></div></div>
        </section>
        <section class="jn-screen" id="screen-rank" data-label="热门排行">
          <div class="jn-screen-inner"><div id="rank-cols"></div></div>
        </section>
        <section class="jn-screen" id="screen-related" data-label="延伸阅读">
          <div class="jn-screen-inner">
            <div id="related"></div>
            <footer class="jn-footer jn-footer--inline">
              <div class="jn-footer-brand">
                <span class="jn-logo" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6.5C4 5.1 5.1 4 6.5 4h11C18.9 4 20 5.1 20 6.5V19a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 17.5v-11Z"/>
                    <path d="M4 8.5h16"/>
                    <path d="M8 13h5M8 16h7"/>
                    <circle cx="17" cy="11.5" r="1.7" fill="currentColor" stroke="none"/>
                  </svg>
                </span>
                岗位大新闻
              </div>
              <div class="jn-footer-note">内容与数据均为示例，不代表真实统计或新闻来源</div>
            </footer>
          </div>
        </section>
      </div>

      <!-- 右侧导航圆点 -->
      <nav class="jn-dots" id="jn-dots" aria-label="页面导航"></nav>

      <!-- 悬浮搜索触发 -->
      <button type="button" class="jn-fab-search" id="search-toggle" aria-label="打开搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>搜索</span>
      </button>

      <!-- 搜索抽屉 -->
      <div class="jn-search-drawer-mask" id="search-mask" hidden></div>
      <aside class="jn-search-drawer" id="search-drawer" aria-label="搜索与筛选">
        <div class="jn-search-drawer-head">
          <h2 class="jn-section-title">搜索 / 筛选</h2>
          <button type="button" class="jn-search-drawer-close" id="search-close" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="jn-search" id="search-panel">
          <div class="jn-search-field">
            <label class="jn-search-label" for="search-kw">关键词</label>
            <input type="text" id="search-kw" class="jn-search-input" placeholder="标题 / 机构 / 标签…" autocomplete="off" />
          </div>
          <div class="jn-search-field">
            <label class="jn-search-label" for="search-date">发布日期</label>
            <input type="date" id="search-date" class="jn-search-input jn-search-date" min="2026-08-10" max="2026-08-22" />
          </div>
          <div class="jn-search-field">
            <span class="jn-search-label">排序方式</span>
            <div class="jn-search-seg" role="group" aria-label="排序方式">
              <button type="button" class="jn-search-seg-btn is-active" data-sort="date">最新优先</button>
              <button type="button" class="jn-search-seg-btn" data-sort="hot">按热度</button>
            </div>
          </div>
          <div class="jn-search-actions">
            <button type="button" class="jn-search-btn" id="search-go">搜索</button>
            <button type="button" class="jn-search-reset" id="search-reset">清除</button>
          </div>
        </div>
        <div class="jn-search-results" id="search-results"></div>
      </aside>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/cinema-bg.js"></script>
  <script src="../../js/cinema-music.js"></script>
  <script src="../../js/shell.js?v=20260824"></script>

    window.Shell && window.Shell.mount({ pageId: 'news', title: '岗位大新闻', subtitle: '洞察岗位变化，把握职业趋势' });
  </script>
</body>
</html>
