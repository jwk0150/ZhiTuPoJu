<!DOCTYPE html>

<body data-page="home">
  <div id="app-shell"></div>
  <main class="page-main home-dash" id="page-main">
    <section class="home-banner enter" style="--d:.06s">

        <a class="btn btn-primary home-banner-cta" href="map.html">进入地图</a>
      </div>
      <div class="home-banner-visual" aria-hidden="true">
        <div class="home-globe-wrap">
          <img class="home-globe" src="../assets/brand/home-globe.png" alt="" width="280" height="280" />
          <span class="home-bubble home-bubble--a">数据分析</span>
          <span class="home-bubble home-bubble--b">人工智能</span>
          <span class="home-bubble home-bubble--c">产品设计</span>

        </span>
        <strong>岗位洞察</strong>
        <p>深度分析岗位需求变化与能力演化趋势</p>
        <span class="home-quick-go" aria-hidden="true">→</span>
      </a>
      <a class="home-quick enter" style="--d:.2s" href="discovery.html">
        <span class="home-quick-icon home-quick-icon--cyan" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/><path d="M11 8v6M8 11h6"/></svg>
        </span>
        <strong>新岗位发现</strong>
        <p>智能识别新兴岗位与市场机会信号</p>
        <span class="home-quick-go" aria-hidden="true">→</span>
      </a>
      <a class="home-quick enter" style="--d:.26s" href="match.html">
        <span class="home-quick-icon home-quick-icon--violet" aria-hidden="true">

        <span class="home-quick-go" aria-hidden="true">→</span>
      </a>
      <a class="home-quick enter" style="--d:.32s" href="more/data.html">
        <span class="home-quick-icon home-quick-icon--orange" aria-hidden="true">

        <span class="home-quick-go" aria-hidden="true">→</span>

      <a class="home-quick enter" style="--d:.38s" href="match.html?tab=profile">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

        <span class="home-quick-go" aria-hidden="true">→</span>

        <span class="home-quick-go" aria-hidden="true">→</span>

    <div class="home-bottom enter" style="--d:.52s">

        <h3>平台概览</h3>
        <div class="home-kpi-grid">
          <article class="home-kpi">
            <div class="home-kpi-label">人才总量</div>
            <div class="home-kpi-value" data-count="128560">0</div>
            <div class="home-kpi-trend is-up">↑ 12.5%</div>
          </article>
          <article class="home-kpi">
            <div class="home-kpi-label">岗位总量</div>
            <div class="home-kpi-value" data-count="35892">0</div>
            <div class="home-kpi-trend is-up">↑ 8.3%</div>
          </article>
          <article class="home-kpi">
            <div class="home-kpi-label">匹配成功率</div>
            <div class="home-kpi-value"><span data-count="786">0</span><small>%</small></div>
            <div class="home-kpi-trend is-up">↑ 5.2%</div>
          </article>
          <article class="home-kpi">

            <div class="home-kpi-value" data-count="24568">0</div>
            <div class="home-kpi-trend is-up">↑ 15.7%</div>

        </div>

      <section class="home-panel home-trend" aria-label="匹配趋势">
        <div class="home-trend-head">
          <h3>匹配趋势</h3>
          <span class="home-trend-tag">近7天</span>
        </div>
        <div class="home-trend-chart" id="home-trend-chart" role="img" aria-label="近7天匹配趋势"></div>
      </section>
