<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>执图破局 · Digital Talent Mapping</title>
    <style>
        /* ============ Design Tokens ============ */
        :root {
            /* Colors */
            --color-bg-base: #F8FAFC;
            --color-bg-left: #F8FAFC;
            --color-bg-right: #FFFFFF;
            --color-surface: #FFFFFF;
            --color-border: #E2E8F0;
            --color-border-light: #F1F5F9;
            --color-text-primary: #0F172A;
            --color-text-secondary: #64748B;
            --color-text-muted: #94A3B8;
            --color-primary: #2563EB;
            --color-primary-hover: #1D4ED8;
            --color-secondary: #0EA5E9;

            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 6px rgba(15, 23, 42, 0.05);
            --shadow-lg: 0 10px 15px rgba(15, 23, 42, 0.08);
            --shadow-focus: 0 0 0 3px rgba(37, 99, 235, 0.1);

            /* Duration */
            --duration-fast: 150ms;
            --duration-normal: 250ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg-base);
            min-height: 100vh;
            color: var(--color-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
        }

        /* ============ Main Container ============ */
        .main-container {
            display: grid;
            grid-template-columns: 55fr 45fr;
            min-height: 100vh;
        }

        /* ============ Language Selector ============ */
        .lang-selector {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: all var(--duration-fast);
        }

        .lang-selector:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .lang-selector svg {
            width: 16px;
            height: 16px;
        }

        /* ============ Brand Section ============ */
        .brand-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #F8FAFC 100%);
            position: relative;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 80px;
        }

        .brand-logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .brand-logo-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: var(--color-text-primary);
            letter-spacing: 0.3px;
            line-height: 1;
        }

        .brand-name-en {
            font-size: 10px;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .brand-title {
            font-size: 52px;
            font-weight: 700;
            line-height: 1.15;
            color: var(--color-text-primary);
            margin-bottom: 20px;
            letter-spacing: -1.2px;
        }

        .brand-title-highlight {
            color: var(--color-primary);
        }

        .brand-subtitle {
            font-size: 16px;
            line-height: 1.6;
            color: var(--color-text-secondary);
            max-width: 440px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 60px;
            align-self: flex-start;
        }

        .brand-logo-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo-icon svg {
            width: 48px;
            height: 48px;
            color: var(--color-primary);
        }

        .brand-logo-text-wrapper {
            display: flex;
            flex-direction: column;
        }

        .brand-logo-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-primary);
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .brand-logo-subtitle {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-text-muted);
            font-weight: 500;
            margin-top: 2px;
        }

        .brand-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--color-text-primary);
            margin-bottom: 20px;
            letter-spacing: -1px;
            margin-top: 120px;
        }

        .brand-title-highlight {
            color: var(--color-primary);
        }

        .brand-subtitle {
            font-size: 17px;
            line-height: 1.6;
            color: var(--color-text-secondary);
            max-width: 440px;
            font-weight: 400;
        }

        /* ============ Login Section ============ */
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: var(--color-bg-right);
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--color-surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border-light);
        }

        .login-header {
            margin-bottom: 32px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.5;
            font-weight: 400;
        }

        /* ============ Tabs ============ */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            padding: 4px;
            background: var(--color-bg-base);
            border-radius: var(--radius-md);
        }

        .tab {
            flex: 1;
            padding: 10px 20px;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all var(--duration-normal) cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
        }

        .tab:hover:not(.active) {
            color: var(--color-text-primary);
        }

        .tab.active {
            background: var(--color-primary);
            color: #FFFFFF;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        }

        /* ============ Form ============ */
        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            font-size: 14px;
            font-family: var(--font-sans);
            transition: all var(--duration-fast);
        }

        .input-wrapper input:hover {
            border-color: var(--color-text-muted);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-wrapper input::placeholder {
            color: var(--color-text-muted);
        }

        .input-wrapper.with-icon input {
            padding-right: 44px;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-text-muted);
            transition: color var(--duration-fast);
        }

        .input-icon:hover {
            color: var(--color-text-secondary);
        }

        .input-icon svg {
            width: 18px;
            height: 18px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 20px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--color-text-secondary);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            font-size: 13px;
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: color var(--duration-fast);
        }

        .forgot-password:hover {
            color: var(--color-primary);
        }

        /* ============ Button ============ */
        .btn-primary {
            width: 100%;
            padding: 12px 20px;
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--duration-fast);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--color-primary-hover);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.22);
            transform: translateY(-1px);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-success-icon {
            width: 16px;
            height: 16px;
            animation: successPop 0.3s ease-out;
        }

        @keyframes successPop {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary .arrow {
            margin-left: auto;
        }

        .btn-primary .arrow svg {
            width: 16px;
            height: 16px;
        }

        .btn-loading {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-secondary {
            width: 100%;
            padding: 11px 20px;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--duration-fast);
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: var(--color-text-secondary);
            background: rgba(15, 23, 42, 0.03);
        }

        .btn-secondary svg {
            width: 14px;
            height: 14px;
        }

        /* ============ Divider ============ */
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--color-border);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .divider span {
            color: var(--color-text-muted);
            font-size: 12px;
            padding: 0 12px;
            background: var(--color-surface);
            font-weight: 400;
        }

        /* ============ Error Message ============ */
        .error-message {
            color: #EF4444;
            font-size: 13px;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.06);
            border-radius: var(--radius-sm);
            border-left: 3px solid #EF4444;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ============ Responsive ============ */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .brand-section {
                padding: 60px 40px;
                min-height: 50vh;
            }

            .login-section {
                padding: 40px;
            }

            .brand-title {
                font-size: 36px;
            }
        }

        @media (max-width: 640px) {
            .brand-section {
                padding: 40px 24px;
                min-height: 40vh;
            }

            .login-section {
                padding: 24px;
            }

            .brand-title {
                font-size: 32px;
            }

            .login-title {
                font-size: 24px;
            }
        }

        /* ============ Reduced Motion ============ */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============ Talent Intelligence Network ============ */
        .talent-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            pointer-events: none;
        }

        .talent-network svg {
            width: 100%;
            height: 100%;
        }

        /* Node Animations */
        @keyframes nodeAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes nodeBreathe {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes corePulse {
            0%, 100% {
                r: 8;
                opacity: 0.9;
            }
            50% {
                r: 9;
                opacity: 1;
            }
        }

        @keyframes dataFlow {
            from {
                stroke-dashoffset: 20;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        .core-node {
            animation: nodeAppear 1s ease-out, nodeBreathe 4s ease-in-out infinite 1s;
        }

        .primary-node {
            animation: nodeAppear 1.2s ease-out 0.2s backwards, nodeBreathe 5s ease-in-out infinite 1.5s;
        }

        .secondary-node {
            animation: nodeAppear 1.5s ease-out 0.4s backwards;
        }

        .relationship-line {
            stroke-dasharray: 4 4;
            animation: dataFlow 8s linear infinite;
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        <!-- Brand Section -->
        <div class="brand-section">
            <!-- Talent Intelligence Network -->
            <div class="talent-network">
                <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Relationship Lines -->
                    <!-- Core to Primary -->
                    <line class="relationship-line" x1="200" y1="300" x2="200" y2="150" stroke="#2563EB" stroke-width="1.5" opacity="0.15"/>
                    <line class="relationship-line" x1="200" y1="300" x2="350" y2="380" stroke="#2563EB" stroke-width="1.5" opacity="0.15"/>
                    <line class="relationship-line" x1="200" y1="300" x2="50" y2="380" stroke="#2563EB" stroke-width="1.5" opacity="0.15"/>

                    <!-- Primary to Secondary -->
                    <line class="relationship-line" x1="200" y1="150" x2="120" y2="100" stroke="#2563EB" stroke-width="1" opacity="0.08"/>
                    <line class="relationship-line" x1="200" y1="150" x2="280" y2="100" stroke="#2563EB" stroke-width="1" opacity="0.08"/>
                    <line class="relationship-line" x1="350" y1="380" x2="420" y2="320" stroke="#2563EB" stroke-width="1" opacity="0.08"/>
                    <line class="relationship-line" x1="350" y1="380" x2="450" y2="420" stroke="#2563EB" stroke-width="1" opacity="0.08"/>
                    <line class="relationship-line" x1="50" y1="380" x2="30" y2="320" stroke="#2563EB" stroke-width="1" opacity="0.08"/>
                    <line class="relationship-line" x1="50" y1="380" x2="100" y2="450" stroke="#2563EB" stroke-width="1" opacity="0.08"/>

                    <!-- Secondary connections -->
                    <line class="relationship-line" x1="120" y1="100" x2="280" y2="100" stroke="#2563EB" stroke-width="0.8" opacity="0.05"/>
                    <line class="relationship-line" x1="420" y1="320" x2="450" y2="420" stroke="#2563EB" stroke-width="0.8" opacity="0.05"/>

                    <!-- Secondary Nodes (smallest, very subtle) -->
                    <circle class="secondary-node" cx="120" cy="100" r="3" fill="#2563EB" opacity="0.15"/>
                    <circle class="secondary-node" cx="280" cy="100" r="3" fill="#2563EB" opacity="0.15"/>
                    <circle class="secondary-node" cx="420" cy="320" r="3" fill="#2563EB" opacity="0.15"/>
                    <circle class="secondary-node" cx="450" cy="420" r="3" fill="#2563EB" opacity="0.15"/>
                    <circle class="secondary-node" cx="30" cy="320" r="3" fill="#2563EB" opacity="0.15"/>
                    <circle class="secondary-node" cx="100" cy="450" r="3" fill="#2563EB" opacity="0.15"/>
                    <circle class="secondary-node" cx="320" cy="180" r="2.5" fill="#2563EB" opacity="0.12"/>
                    <circle class="secondary-node" cx="80" cy="250" r="2.5" fill="#2563EB" opacity="0.12"/>
                    <circle class="secondary-node" cx="260" cy="420" r="2.5" fill="#2563EB" opacity="0.12"/>

                    <!-- Primary Nodes (medium importance) -->
                    <!-- Talent Node -->
                    <circle class="primary-node" cx="200" cy="150" r="6" fill="#2563EB" opacity="0.3"/>
                    <circle cx="200" cy="150" r="12" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.15"/>
                    <text x="200" y="135" font-size="11" fill="#2563EB" opacity="0.5" text-anchor="middle" font-weight="500">人才</text>
                    <text x="200" y="180" font-size="8" fill="#64748B" opacity="0.4" text-anchor="middle">Talent</text>

                    <!-- Capability Node -->
                    <circle class="primary-node" cx="350" cy="380" r="6" fill="#0EA5E9" opacity="0.3"/>
                    <circle cx="350" cy="380" r="12" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.15"/>
                    <text x="350" y="365" font-size="11" fill="#0EA5E9" opacity="0.5" text-anchor="middle" font-weight="500">能力</text>
                    <text x="350" y="410" font-size="8" fill="#64748B" opacity="0.4" text-anchor="middle">Capability</text>

                    <!-- Organization Node -->
                    <circle class="primary-node" cx="50" cy="380" r="6" fill="#0EA5E9" opacity="0.3"/>
                    <circle cx="50" cy="380" r="12" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.15"/>
                    <text x="50" y="365" font-size="11" fill="#0EA5E9" opacity="0.5" text-anchor="middle" font-weight="500">组织</text>
                    <text x="50" y="410" font-size="8" fill="#64748B" opacity="0.4" text-anchor="middle">Organization</text>

                    <!-- Core Node (most prominent) -->
                    <circle class="core-node" cx="200" cy="300" r="8" fill="#2563EB" opacity="0.9"/>
                    <circle cx="200" cy="300" r="16" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.25"/>
                    <circle cx="200" cy="300" r="24" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.12">
                        <animate attributeName="r" values="24;28;24" dur="4s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.12;0.05;0.12" dur="4s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>

            <div class="brand-logo">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 48 48" fill="none" stroke="#2563EB" stroke-width="2.5">
                        <circle cx="24" cy="24" r="5"/>
                        <circle cx="24" cy="8" r="2.5"/>
                        <circle cx="24" cy="40" r="2.5"/>
                        <circle cx="8" cy="24" r="2.5"/>
                        <circle cx="40" cy="24" r="2.5"/>
                        <line x1="24" y1="10.5" x2="24" y2="19"/>
                        <line x1="24" y1="29" x2="24" y2="37.5"/>
                        <line x1="10.5" y1="24" x2="19" y2="24"/>
                        <line x1="29" y1="24" x2="37.5" y2="24"/>
                    </svg>
                </div>
                <div class="brand-logo-text">
                    <div class="brand-name">执图破局</div>
                    <div class="brand-name-en">DIGITAL TALENT MAPPING</div>
                </div>
            </div>

            <h1 class="brand-title">看见人才，<br><span class="brand-title-highlight">连接能力</span>。</h1>
            <p class="brand-subtitle">用数据构建人才画像、能力关系与组织洞察。</p>
        </div>

        <!-- Login Section -->
        <div class="login-section">
            <div class="login-card">
                <div class="login-header">
                    <h2 class="login-title">欢迎回来</h2>
                    <p class="login-desc">登录你的账户，继续探索人才数据</p>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <div class="tab active" data-tab="login">登录</div>
                    <div class="tab" data-tab="register">注册</div>
                </div>

                <!-- Login Form -->
                <div class="form-content active" id="login-form">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <div class="input-wrapper">
                            <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="input-wrapper with-icon">
                            <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                            <span class="input-icon" onclick="togglePassword('login-password')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <div class="error-message" id="login-error"></div>
                    <button class="btn-primary" onclick="handleLogin()">
                        <span>登录</span>
                        <span class="arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </span>
                    </button>

                    <div class="divider"><span>或</span></div>
                    <button class="btn-secondary" onclick="devLogin()">
                        <span>开发者入口</span>
                        <span class="arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </span>
                    </button>
                </div>

                <!-- Register Form -->
                <div class="form-content" id="register-form">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <div class="input-wrapper">
                            <input type="text" id="reg-username" placeholder="3-20个字符" autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="input-wrapper with-icon">
                            <input type="password" id="reg-password" placeholder="至少6位" autocomplete="new-password">
                            <span class="input-icon" onclick="togglePassword('reg-password')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <div class="input-wrapper with-icon">
                            <input type="password" id="reg-password-confirm" placeholder="再次输入密码" autocomplete="new-password">
                            <span class="input-icon" onclick="togglePassword('reg-password-confirm')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="error-message" id="register-error"></div>
                    <button class="btn-primary" onclick="handleRegister()">
                        <span>注册</span>
                        <span class="arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div><!-- End page-wrapper -->

    <script>
        const API_BASE = window.API_BASE || 'http://127.0.0.1:5000';

        // ============ Talent Network Mouse Parallax ============
        const talentNetworkEl = document.querySelector('.talent-network');
        const brandSectionEl = document.querySelector('.brand-section');
        const prefersReducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

        if (talentNetworkEl && brandSectionEl && !prefersReducedMotionQuery.matches) {
            brandSectionEl.addEventListener('mousemove', (e) => {
                const rect = brandSectionEl.getBoundingClientRect();
                const relX = (e.clientX - rect.left) / rect.width - 0.5;
                const relY = (e.clientY - rect.top) / rect.height - 0.5;
                talentNetworkEl.style.transform = `translate(${relX * 12}px, ${relY * 12}px)`;
            });

            brandSectionEl.addEventListener('mouseleave', () => {
                talentNetworkEl.style.transform = 'translate(0, 0)';
            });
        }

        // ============ Tab Switching ============
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tabName + '-form').classList.add('active');
            });
        });

        // ============ Toggle Password Visibility ============
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.input-icon svg');

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        // ============ Developer Quick Entry ============
        function devLogin() {
            localStorage.setItem('zhitu_user', JSON.stringify({
                username: 'developer',
                role: 'dev',
                loginTime: Date.now()
            }));
            window.location.href = 'pages/home.html';
        }

        // ============ Login ============
        async function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.querySelector('#login-form .btn-primary');

            errorEl.classList.remove('show');

            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.classList.add('show');
                return;
            }

            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="btn-loading"></div><span>登录中...</span>';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.code === 0) {
                    localStorage.setItem('zhitu_user', JSON.stringify(result.data));
                    btn.innerHTML = '<svg class="btn-success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>登录成功</span>';
                    setTimeout(() => {
                        window.location.href = 'pages/home.html';
                    }, 500);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    errorEl.textContent = result.message || '登录失败';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                btn.disabled = false;
                btn.innerHTML = originalText;
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.classList.add('show');
            }
        }

        // ============ Register ============
        async function handleRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;
            const errorEl = document.getElementById('register-error');
            const btn = document.querySelector('#register-form .btn-primary');

            errorEl.classList.remove('show');

            if (!username || username.length < 3 || username.length > 20) {
                errorEl.textContent = '用户名长度应为3-20个字符';
                errorEl.classList.add('show');
                return;
            }

            if (!password || password.length < 6) {
                errorEl.textContent = '密码长度至少6位';
                errorEl.classList.add('show');
                return;
            }

            if (password !== passwordConfirm) {
                errorEl.textContent = '两次密码输入不一致';
                errorEl.classList.add('show');
                return;
            }

            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="btn-loading"></div><span>注册中...</span>';

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.code === 0) {
                    btn.innerHTML = '<svg class="btn-success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>注册成功</span>';
                    setTimeout(() => {
                        document.querySelector('[data-tab="login"]').click();
                        document.getElementById('login-username').value = username;
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }, 800);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    errorEl.textContent = result.message || '注册失败';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                console.error('Register error:', error);
                btn.disabled = false;
                btn.innerHTML = originalText;
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.classList.add('show');
            }
        }

        // ============ Enter Key Handler ============
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const activeForm = document.querySelector('.form-content.active');
                if (activeForm.id === 'login-form') {
                    handleLogin();
                } else {
                    handleRegister();
                }
            }
        });

    </script>
</body>
</html>
