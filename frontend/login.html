<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>执图破局 · 登录</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text-dark);
      background:
        linear-gradient(120deg, rgba(234,246,251,.55), rgba(255,255,255,.35)),
        center / cover no-repeat url('assets/brand/hero-bg.png');
    }
    .login-logo {
      position: fixed;
      top: 22px;
      right: 22px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: center / cover no-repeat url('assets/brand/logo.png'), #fff;
      box-shadow: 0 10px 28px rgba(10,168,188,.28);
      z-index: 20;
    }
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }
    .login-card {
      width: min(420px, 100%);
      background: rgba(255,255,255,.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 26px 24px;
      box-shadow: 0 18px 40px rgba(20,80,110,.12);
      backdrop-filter: blur(10px);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand-mark-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: center / cover no-repeat url('assets/brand/logo.png'), #fff;
    }
    .brand-mark h1 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
    }
    .brand-mark p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #eef7fa;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .tab {
      text-align: center;
      padding: 9px 0;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .tab.active {
      background: #fff;
      color: var(--signal-deep);
      box-shadow: 0 2px 8px rgba(10,168,188,.12);
    }
    .form-content { display: none; }
    .form-content.active { display: block; }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text-dark);
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--signal);
      box-shadow: 0 0 0 3px rgba(31,200,217,.15);
    }
    .input-wrapper.with-icon input { padding-right: 40px; }
    .input-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
    }
    .input-icon svg { width: 18px; height: 18px; display: block; }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .remember-me { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .forgot-password { color: var(--signal-deep); }
    .error-message {
      display: none;
      color: #dc2626;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .error-message.show { display: block; }
    .btn-primary, .btn-secondary {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--signal), var(--signal-deep));
      color: #fff;
      box-shadow: 0 10px 22px rgba(10,168,188,.28);
    }
    .btn-primary:disabled { opacity: .7; cursor: wait; }
    .btn-secondary {
      margin-top: 10px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-dark);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 10px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .btn-loading {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    .btn-success-icon { width: 18px; height: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      .login-logo { width: 58px; height: 58px; top: 14px; right: 14px; }
    }
  </style>
</head>
<body>
  <div class="login-logo" title="执图破局" role="img" aria-label="平台 Logo"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">
        <div class="brand-mark-logo" aria-hidden="true"></div>
        <div>
          <h1>执图破局</h1>
          <p>Digital Talent Mapping</p>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="login">登录</div>
        <div class="tab" data-tab="register">注册</div>
      </div>

      <div class="form-content active" id="login-form">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <div class="input-wrapper">
            <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-wrapper with-icon">
            <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" />
            <span class="input-icon" onclick="togglePassword('login-password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>
        <div class="form-options">
          <label class="remember-me"><input type="checkbox" id="remember-me" /><span>记住我</span></label>
          <a href="#" class="forgot-password">忘记密码？</a>
        </div>
        <div class="error-message" id="login-error"></div>
        <button class="btn-primary" onclick="handleLogin()"><span>登录</span></button>
        <div class="divider"><span>或</span></div>
        <button class="btn-secondary" onclick="devLogin()"><span>开发者入口</span></button>
      </div>

      <div class="form-content" id="register-form">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <div class="input-wrapper"><input type="text" id="reg-username" placeholder="3-20个字符" autocomplete="username" /></div>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-wrapper with-icon">
            <input type="password" id="reg-password" placeholder="至少6位" autocomplete="new-password" />
            <span class="input-icon" onclick="togglePassword('reg-password')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <div class="input-wrapper with-icon">
            <input type="password" id="reg-password-confirm" placeholder="再次输入密码" autocomplete="new-password" />
            <span class="input-icon" onclick="togglePassword('reg-password-confirm')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>
        <div class="error-message" id="register-error"></div>
        <button class="btn-primary" onclick="handleRegister()"><span>注册</span></button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.API_BASE || 'http://127.0.0.1:5000';

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tabName + '-form').classList.add('active');
      });
    });

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function devLogin() {
      localStorage.setItem('zhitu_user', JSON.stringify({
        username: 'developer', role: 'dev', loginTime: Date.now()
      }));
      window.location.href = 'pages/home.html';
    }

    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.querySelector('#login-form .btn-primary');
      errorEl.classList.remove('show');
      if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.classList.add('show');
        return;
      }
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<div class="btn-loading"></div><span>登录中...</span>';
      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if (result.code === 0) {
          localStorage.setItem('zhitu_user', JSON.stringify(result.data));
          btn.innerHTML = '<span>登录成功</span>';
          setTimeout(() => { window.location.href = 'pages/home.html'; }, 400);
        } else {
          btn.disabled = false;
          btn.innerHTML = originalText;
          errorEl.textContent = result.message || '登录失败';
          errorEl.classList.add('show');
        }
      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      }
    }

    async function handleRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const passwordConfirm = document.getElementById('reg-password-confirm').value;
      const errorEl = document.getElementById('register-error');
      const btn = document.querySelector('#register-form .btn-primary');
      errorEl.classList.remove('show');
      if (!username || username.length < 3 || username.length > 20) {
        errorEl.textContent = '用户名长度应为3-20个字符';
        errorEl.classList.add('show');
        return;
      }
      if (!password || password.length < 6) {
        errorEl.textContent = '密码长度至少6位';
        errorEl.classList.add('show');
        return;
      }
      if (password !== passwordConfirm) {
        errorEl.textContent = '两次密码输入不一致';
        errorEl.classList.add('show');
        return;
      }
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<div class="btn-loading"></div><span>注册中...</span>';
      try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if (result.code === 0) {
          btn.innerHTML = '<span>注册成功</span>';
          setTimeout(() => {
            document.querySelector('[data-tab="login"]').click();
            document.getElementById('login-username').value = username;
            btn.disabled = false;
            btn.innerHTML = originalText;
          }, 700);
        } else {
          btn.disabled = false;
          btn.innerHTML = originalText;
          errorEl.textContent = result.message || '注册失败';
          errorEl.classList.add('show');
        }
      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key !== 'Enter') return;
      const activeForm = document.querySelector('.form-content.active');
      if (activeForm && activeForm.id === 'login-form') handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
