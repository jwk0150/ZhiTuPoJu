<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <linearGradient id="gUser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a85f1"/><stop offset="1" stop-color="#4f6ef0"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FC8D9"/><stop offset="1" stop-color="#1EA8E8"/>
    </linearGradient>
    <linearGradient id="gBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d5fff"/><stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="gData" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7971e"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="gCrawl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11998e"/><stop offset="1" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="gAi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eb3349"/><stop offset="1" stop-color="#f45c43"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b8c"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:700;fill:#1b2440}
      .sub{font-size:13px;fill:#7a86a3}
      .layer-name{font-size:15px;font-weight:700;fill:#fff}
      .box-title{font-size:14px;font-weight:700;fill:#1b2440}
      .box-text{font-size:11.5px;fill:#48506b}
      .box-text2{font-size:10.5px;fill:#6b7493}
      .fn{font-size:11.5px;font-weight:600;fill:#fff}
      .edge{stroke:#5b6b8c;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .edge-thin{stroke:#9aa6c2;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="1180" fill="#f5f7fc"/>

  <!-- header -->
  <text x="640" y="46" text-anchor="middle" class="title">「执图破局」多源异构数据驱动岗位能力图谱 · 总体项目架构图</text>
  <text x="640" y="70" text-anchor="middle" class="sub">新岗位发现 · 能力动态演化 · 全景图谱 · 人岗匹配诊断</text>

  <!-- ============ 用户/浏览器 ============ -->
  <rect x="490" y="92" width="300" height="54" rx="10" fill="url(#gUser)"/>
  <text x="640" y="118" text-anchor="middle" class="layer-name">用户 / 浏览器</text>
  <text x="640" y="137" text-anchor="middle" fill="#eaf0ff" font-size="11">Chrome / Edge / Firefox · 访问 localhost:8080</text>

  <!-- arrow user -> front -->
  <line x1="640" y1="146" x2="640" y2="176" class="edge"/>

  <!-- ============ 前端层 ============ -->
  <rect x="120" y="180" width="1040" height="220" rx="14" fill="#eef4ff" stroke="#bcd2ff" stroke-width="1.5"/>
  <rect x="120" y="180" width="1040" height="34" rx="14" fill="url(#gFront)"/>
  <text x="140" y="203" class="layer-name">前端层  frontend/  · 纯 HTML/CSS/JS 单页应用 (静态服务 :8080)</text>

  <!-- shell -->
  <rect x="140" y="228" width="232" height="156" rx="10" fill="#ffffff" stroke="#d4e2ff"/>
  <text x="156" y="252" class="box-title">应用外壳 shell.js</text>
  <text x="156" y="274" class="box-text">· 统一导航 / 左侧菜单</text>
  <text x="156" y="294" class="box-text">· 返回拦截 / 页面切换</text>
  <text x="156" y="314" class="box-text">· 内嵌 iframe 框架</text>
  <text x="156" y="334" class="box-text">· PAGE_HREF 路径集中管理</text>
  <text x="156" y="356" class="box-text2">runtime-core.js (switchView)</text>

  <!-- pages -->
  <rect x="396" y="228" width="248" height="156" rx="10" fill="#ffffff" stroke="#d4e2ff"/>
  <text x="412" y="252" class="box-title">页面 pages/</text>
  <text x="412" y="274" class="box-text">· index / portal（门户）</text>
  <text x="412" y="294" class="box-text">· insight（能力演化）</text>
  <text x="412" y="314" class="box-text">· learning-path（学习路径）</text>
  <text x="412" y="334" class="box-text">· new-skill（新增技能详情）</text>
  <text x="412" y="354" class="box-text2">· profile / trends / match …</text>

  <!-- logic -->
  <rect x="668" y="228" width="232" height="156" rx="10" fill="#ffffff" stroke="#d4e2ff"/>
  <text x="684" y="252" class="box-title">逻辑 js/pages/</text>
  <text x="684" y="274" class="box-text">· evolution.js（核心）</text>
  <text x="684" y="294" class="box-text">· matching / discovery</text>
  <text x="684" y="314" class="box-text">· graph / talents</text>
  <text x="684" y="334" class="box-text2">lib/：ECharts · 地图 · axios</text>

  <!-- four functions -->
  <rect x="924" y="228" width="220" height="156" rx="10" fill="#e3f7ff" stroke="#9fe0f5"/>
  <text x="940" y="252" class="box-title">四大功能入口</text>
  <rect x="940" y="262" width="188" height="26" rx="6" fill="url(#gFront)"/><text x="1034" y="279" text-anchor="middle" class="fn">① 新岗位发现</text>
  <rect x="940" y="292" width="188" height="26" rx="6" fill="url(#gFront)"/><text x="1034" y="309" text-anchor="middle" class="fn">② 能力动态更新</text>
  <rect x="940" y="322" width="188" height="26" rx="6" fill="url(#gFront)"/><text x="1034" y="339" text-anchor="middle" class="fn">③ 全景图谱</text>
  <rect x="940" y="352" width="188" height="22" rx="6" fill="url(#gFront)"/><text x="1034" y="367" text-anchor="middle" class="fn">④ 人岗匹配诊断</text>

  <!-- arrow front -> back -->
  <line x1="640" y1="400" x2="640" y2="430" class="edge"/>
  <text x="652" y="420" class="box-text2">REST API / JSON  (:8000 /api/*)</text>

  <!-- ============ 后端层 ============ -->
  <rect x="120" y="434" width="1040" height="236" rx="14" fill="#f3efff" stroke="#d9c9ff"/>
  <rect x="120" y="434" width="1040" height="34" rx="14" fill="url(#gBack)"/>
  <text x="140" y="457" class="layer-name">后端层  backend/  · FastAPI + Uvicorn（:8000）</text>

  <!-- routers -->
  <rect x="140" y="482" width="500" height="80" rx="10" fill="#ffffff" stroke="#e0d4ff"/>
  <text x="156" y="506" class="box-title">接入层 routers/</text>
  <text x="156" y="528" class="box-text">agent(对话) · collection(采集) · discovery(新岗位)</text>
  <text x="156" y="548" class="box-text">evolution(演化) · matching(匹配) · graph(图谱) · data · talent_map</text>

  <!-- ai/alg -->
  <rect x="664" y="482" width="476" height="80" rx="10" fill="#ffffff" stroke="#e0d4ff"/>
  <text x="680" y="506" class="box-title">业务 / 算法层</text>
  <text x="680" y="528" class="box-text">evolution_agent(时序图谱演化推理) · matching(匹配≥90%)</text>
  <text x="680" y="548" class="box-text">services(画像/趋势) · llm(DeepSeek封装) · models · mappings</text>

  <!-- data access -->
  <rect x="140" y="576" width="1000" height="74" rx="10" fill="#ffffff" stroke="#e0d4ff"/>
  <text x="156" y="600" class="box-title">数据访问层</text>
  <text x="156" y="622" class="box-text">db.py / db_async.py（PostgreSQL 同步+异步驱动）</text>
  <text x="156" y="642" class="box-text2">data.py（查询封装） · job_pool.py（岗位池） · config.py · mappings.py</text>

  <!-- arrow back -> data + ai -->
  <line x1="420" y1="670" x2="360" y2="700" class="edge"/>
  <line x1="900" y1="670" x2="960" y2="700" class="edge"/>
  <text x="300" y="694" class="box-text2" text-anchor="middle">SQL</text>
  <text x="1020" y="694" class="box-text2" text-anchor="middle">HTTP</text>

  <!-- ============ 数据层 ============ -->
  <rect x="120" y="704" width="490" height="118" rx="14" fill="#fff5e6" stroke="#ffd9a0"/>
  <rect x="120" y="704" width="490" height="34" rx="14" fill="url(#gData)"/>
  <text x="140" y="727" class="layer-name">数据层  PostgreSQL 15+</text>
  <text x="140" y="754" class="box-text">· job_postings（JD 主表）</text>
  <text x="140" y="776" class="box-text">· job_posting_details（详情解析）</text>
  <text x="140" y="798" class="box-text">· 触发器变更捕获 · 统计视图 / 索引</text>

  <!-- ============ AI 层 ============ -->
  <rect x="670" y="704" width="490" height="118" rx="14" fill="#ffeceb" stroke="#ffc2bb"/>
  <rect x="670" y="704" width="490" height="34" rx="14" fill="url(#gAi)"/>
  <text x="690" y="727" class="layer-name">外部 / AI 层</text>
  <text x="690" y="754" class="box-text">· DeepSeek API（大模型推理引擎）</text>
  <text x="690" y="776" class="box-text">· 招聘站点 / 行业报告（数据源）</text>
  <text x="690" y="798" class="box-text">→ 推理：岗位发现 / 技能演化 / 智能问答</text>

  <!-- arrow data <- crawler -->
  <line x1="365" y1="822" x2="365" y2="852" class="edge"/>
  <text x="375" y="844" class="box-text2">ETL 写入</text>

  <!-- ============ 采集层 ============ -->
  <rect x="120" y="856" width="1040" height="120" rx="14" fill="#e9fbf1" stroke="#a9efc6"/>
  <rect x="120" y="856" width="1040" height="34" rx="14" fill="url(#gCrawl)"/>
  <text x="140" y="879" class="layer-name">采集层  crawler/  · 多源异构数据采集</text>
  <text x="140" y="906" class="box-text">· spiders/（站点爬虫） · parser/（结构化解析） · exchange/（数据交换）</text>
  <text x="140" y="928" class="box-text">· ops/（运维调度） · sql/（建表 DDL） · models/ · db.py · config.py</text>
  <text x="140" y="950" class="box-text2">采集 → 解析 → 写入 PostgreSQL → 后端分析 → 前端可视化（闭环）</text>

  <!-- legend -->
  <rect x="120" y="1000" width="1040" height="120" rx="14" fill="#ffffff" stroke="#dde3f0"/>
  <text x="140" y="1026" class="box-title">分层职责</text>
  <text x="140" y="1050" class="box-text">采集层 crawler/  —— 多源异构数据爬取与结构化</text>
  <text x="140" y="1072" class="box-text">数据层 PostgreSQL —— 持久化 JD / 详情 / 触发器变更捕获</text>
  <text x="140" y="1094" class="box-text">后端层 backend/ —— FastAPI 路由 + 演化 Agent + 匹配算法 + LLM 封装</text>
  <text x="640" y="1050" class="box-text">前端层 frontend/ —— 统一外壳 + 四大功能页面 + ECharts 可视化</text>
  <text x="640" y="1072" class="box-text">AI 层 DeepSeek  —— 大模型推理（发现 / 演化 / 问答）</text>
  <text x="640" y="1094" class="box-text">数据流：爬虫→库→后端分析→前端展示→学习路径/差距反馈</text>

  <text x="640" y="1148" text-anchor="middle" class="sub">ZhiTuPoJu · 执图破局 — 整体分层架构（SVG 矢量图）</text>
</svg>
