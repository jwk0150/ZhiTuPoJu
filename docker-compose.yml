# 执图破局 · 应用容器（数据库仍用阿里云，经本机 SSH 隧道）
#
# 启动前务必：start_db_tunnel.cmd（本机 5433 LISTENING）
# 然后：docker compose up -d --build
# 访问：http://127.0.0.1:8080/

name: zhitu

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zhitu-backend
    env_file:
      - .env
    environment:
      # 容器内 127.0.0.1 不是宿主机；经 host.docker.internal 打到本机隧道
      PG_HOST: host.docker.internal
      PG_PORT: "5433"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/backend/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zhitu-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
