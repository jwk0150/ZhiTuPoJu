            - generic [ref=e292]:
              - generic [ref=e293]:
                - heading "岗位概述" [level=3] [ref=e294]
                - paragraph [ref=e295]: Java 开发工程师是企业后端研发的核心岗位，依托 Java 生态完成业务系统的设计、编码实现、接口开发、性能调优与迭代维护工作。随着云原生、分布式架构以及 AI 辅助编程技术普及，岗位能力基线持续迭代，工程师不仅需要扎实的 Java 基础功底，还需要掌握微服务、容器、高并发等现代技术栈，同时懂得借助 AI 工具提升开发效率，面向业务需求交付稳定、可扩展的软件系统，广泛服务于互联网、金融、政务、企业数字化等各类业务场景。
              - generic [ref=e296]:
                - heading "主要工作职责" [level=3] [ref=e297]
                - list [ref=e298]:
                  - listitem [ref=e299]: 参与业务需求评审，结合业务场景完成后端模块、接口、数据库的方案设计，输出技术方案文档；
                  - listitem [ref=e300]: 使用 Java 及主流框架完成业务代码开发、单元测试，借助 AI 辅助编程工具加速编码、排错，保障代码质量；
                  - listitem [ref=e301]: 负责微服务、分布式系统功能开发，处理分布式事务、高并发、数据优化等实际业务难题，保障系统稳定性；
                  - listitem [ref=e302]: 参与问题排查、线上故障定位，完成系统性能优化、接口调优，保障服务高可用；
                  - listitem [ref=e303]: 协同前端、测试、产品团队完成版本迭代，跟进项目上线，持续维护迭代存量业务；
                  - listitem [ref=e304]: 跟进技术演进，淘汰老旧技术方案，落地云原生、可观测性等新技术，推动技术栈升级。
